[project]
name = "shengda-water"
version = "0.1.0"
description = "Application métier télérelevé eau et contrôle vanne Shengda LoRaWAN"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "nats-py>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shengda_water*"]
