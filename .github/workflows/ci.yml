name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  platform-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cd services/platform-api && go test ./...
      - run: cd services/mqtt-ingestion && go test ./...
      - run: cd services/rule-engine && go test ./...

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd apps/console && npm install && npm run build
