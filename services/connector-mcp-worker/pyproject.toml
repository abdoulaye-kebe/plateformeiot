[project]
name = "lorawan-connector-mcp"
version = "0.1.0"
description = "Connecteur MCP sortant — forward uplinks vers serveurs MCP métier (SSE)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "nats-py>=2.9.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["connector_mcp*"]
