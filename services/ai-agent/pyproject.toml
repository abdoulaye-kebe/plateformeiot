[project]
name = "lorawan-ai-agent"
version = "0.1.0"
description = "Agent IA LoRaWAN — serveur MCP + client orchestrateur"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*", "mcp_client*"]
